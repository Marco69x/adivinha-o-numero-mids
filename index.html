<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Adivinhação de Números</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      padding: 30px 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 24px;
    }

    p.description {
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    input[type="number"] {
      width: 100%;
      padding: 12px;
      font-size: 18px;
      border: 2px solid #ddd;
      border-radius: 8px;
      text-align: center;
      outline: none;
      transition: border-color 0.3s;
    }

    input[type="number"]:focus {
      border-color: #667eea;
    }

    .buttons {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-submit {
      background-color: #667eea;
      color: white;
    }

    .btn-submit:hover {
      background-color: #5a67d8;
    }

    .btn-reset {
      background-color: #e2e8f0;
      color: #4a5568;
    }

    .btn-reset:hover {
      background-color: #cbd5e0;
    }

    .message {
      margin-top: 20px;
      font-size: 16px;
      font-weight: 600;
      min-height: 24px;
    }

    .message.success {
      color: #38a169;
    }

    .message.error {
      color: #e53e3e;
    }

    .message.info {
      color: #d69e2e;
    }

    .stats {
      margin-top: 15px;
      font-size: 14px;
      color: #718096;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Adivinhe o Número</h1>
    <p class="description">Escolhi um número secreto entre <strong>1 e 100</strong>. Consegue adivinhar?</p>

    <div class="input-group">
      <input type="number" id="guessInput" placeholder="Digite um número" min="1" max="100" />
    </div>

    <div class="buttons">
      <button class="btn-submit" id="btnCheck">Chutar</button>
      <button class="btn-reset" id="btnRestart">Reiniciar</button>
    </div>

    <div class="message" id="message"></div>
    <div class="stats" id="attempts">Tentativas: 0</div>
  </div>

  <script>
    // Variáveis de controle do jogo
    let secretNumber = generateSecretNumber();
    let attempts = 0;
    let gameOver = false;

    // Elementos do DOM
    const guessInput = document.getElementById('guessInput');
    const btnCheck = document.getElementById('btnCheck');
    const btnRestart = document.getElementById('btnRestart');
    const messageEl = document.getElementById('message');
    const attemptsEl = document.getElementById('attempts');

    // Função para gerar um número aleatório de 1 a 100
    function generateSecretNumber() {
      return Math.floor(Math.random() * 100) + 1;
    }

    // Função para verificar o palpite
    function checkGuess() {
      if (gameOver) return;

      const userGuess = parseInt(guessInput.value);

      // Validação do input
      if (isNaN(userGuess) || userGuess < 1 || userGuess > 100) {
        showMessage('Por favor, digite um número válido entre 1 e 100.', 'error');
        return;
      }

      attempts++;
      attemptsEl.textContent = `Tentativas: ${attempts}`;

      if (userGuess === secretNumber) {
        showMessage(`🎉 Parabéns! Você acertou o número ${secretNumber} em ${attempts} tentativa(s)!`, 'success');
        gameOver = true;
        guessInput.disabled = true;
      } else if (userGuess < secretNumber) {
        showMessage('📈 O número secreto é MAIOR!', 'info');
      } else {
        showMessage('📉 O número secreto é MENOR!', 'info');
      }

      guessInput.value = '';
      guessInput.focus();
    }

    // Função para exibir mensagem
    function showMessage(msg, type) {
      messageEl.textContent = msg;
      messageEl.className = `message ${type}`;
    }

    // Função para reiniciar o jogo
    function restartGame() {
      secretNumber = generateSecretNumber();
      attempts = 0;
      gameOver = false;
      
      attemptsEl.textContent = 'Tentativas: 0';
      messageEl.textContent = '';
      messageEl.className = 'message';
      
      guessInput.disabled = false;
      guessInput.value = '';
      guessInput.focus();
    }

    // Event Listeners (Eventos dos botões e teclado)
    btnCheck.addEventListener('click', checkGuess);
    btnRestart.addEventListener('click', restartGame);

    // Permite pressionar Enter para chutar
    guessInput.addEventListener('keypress', function(event) {
      if (event.key === 'Enter') {
        checkGuess();
      }
    });
  </script>

</body>
</html>
